name: Preview Validation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-preview-bootstrap:
    name: Validate Preview Bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Install Playwright browsers for preview validation
        run: npx playwright install --with-deps chromium

      - name: Run local preview bootstrap smoke
        run: npm run ci:preview-gate
        env:
          CI: true
          PLAYWRIGHT_SKIP_PREVIEW_BUILD: '1'
          PLAYWRIGHT_PREVIEW_ARTIFACTS_DIR: reports/e2e/preview-bootstrap

      - name: Enforce preview bootstrap report artifact
        run: test -f reports/e2e/preview-bootstrap/report.json

      - name: Upload preview validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-validation-artifacts
          path: |
            reports/e2e/preview-bootstrap/**
            playwright-report/**
            test-results/**
          retention-days: 14
