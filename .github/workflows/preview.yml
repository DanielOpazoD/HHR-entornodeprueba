name: Preview Validation

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Only a newer revision of the same PR supersedes an existing run.
# Pushes use run_id so every main/develop validation is preserved.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-preview-bootstrap:
    name: Validate Preview Bootstrap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Install Playwright browsers for preview validation
        run: npx playwright install --with-deps chromium

      - name: Validate census and clinical library preview
        run: npm run ci:preview-gate
        env:
          CI: true
          PLAYWRIGHT_SKIP_PREVIEW_BUILD: '1'
          PLAYWRIGHT_PREVIEW_ARTIFACTS_DIR: reports/e2e/preview-bootstrap

      - name: Summarize census and library results
        if: always()
        run: node scripts/report-preview-summary.mjs

      - name: Enforce preview bootstrap report artifact
        run: test -f reports/e2e/preview-bootstrap/report.json

      - name: Upload preview validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-validation-artifacts
          path: |
            reports/e2e/preview-bootstrap/**
            playwright-report/**
            test-results/**
          retention-days: 14
