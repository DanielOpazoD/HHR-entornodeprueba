name: Deploy Firebase Functions

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Deploys the exact main revision after ci-summary has passed. CI calls this
# workflow only for Functions-related changes; manual retries use the same gate.
# No deploy credentials are exposed until the preflight succeeds.
#
# ----------------------------------------------------------------------------
# Required GitHub repo secret
# ----------------------------------------------------------------------------
# `FIREBASE_SERVICE_ACCOUNT_HHR` — full JSON of a Google Cloud service account
# with at least these IAM roles on `hhr-pruebas`:
#   - Cloud Functions Developer (roles/cloudfunctions.developer)
#     This cannot set invocation IAM for a newly created regional endpoint.
#     Bootstrap its invoker binding separately with an authorized administrator;
#     existing endpoint updates do not require broadening this deployer's roles.
#     An ACTIVE function listing alone does not prove that clients can invoke it.
#   - Service Account User      (roles/iam.serviceAccountUser)
#   - Secret Manager Viewer (roles/secretmanager.viewer) on the
#     TYPESAFE_API_KEY secret only, for deployment metadata access.
#     The deployer does not need permission to read the secret value.
#   - Firebase Admin SDK Administrator Service Agent
#     (roles/firebase.sdkAdminServiceAgent)  — only if the function reads/writes
#     Firestore via firebase-admin under a privileged path; otherwise omit.
#
# Generate the key in GCP Console → IAM & Admin → Service Accounts → Keys → Add
# key (JSON). Paste the entire JSON file contents (including the surrounding
# braces) into the secret value.
#
# This workflow intentionally deploys the currently exported function targets
# instead of sweeping all Functions. That avoids requiring Cloud Scheduler delete
# permissions just to keep removed legacy scheduled functions out of new deploys.
# ----------------------------------------------------------------------------

on:
  workflow_call:
    secrets:
      FIREBASE_SERVICE_ACCOUNT_HHR:
        required: true
  workflow_dispatch:

# Serialize automatic deploys and manual retries of the same test project.
concurrency:
  group: deploy-functions-hhr-pruebas
  queue: max
  cancel-in-progress: false

jobs:
  preflight:
    name: verify-functions-ci
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      eligible: ${{ steps.guard.outputs.eligible }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact CI and current Functions source
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-function-deployment-ci.mjs --guard

  deploy:
    name: deploy-firebase-functions
    needs: [preflight]
    if: needs.preflight.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify deployment credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HHR }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing GitHub secret FIREBASE_SERVICE_ACCOUNT_HHR. See the workflow header for setup instructions."
            exit 1
          fi

      - name: Setup Node.js (functions runtime)
        uses: actions/setup-node@v7
        with:
          # Matches `functions/package.json` engines.node — keep these in sync.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install source parser build dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify shared CUDYR parser
        run: node scripts/build-cudyr-source-parser.mjs --check

      - name: Install function dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Verify Functions discovery runtime
        working-directory: functions
        run: node scripts/checkDeployRuntime.js

      - name: Configure hhr-pruebas Jev pilot flags
        run: |
          # These are non-secret rollout switches; the provider credential stays
          # in Firebase Secret Manager and is never written by this workflow.
          printf '%s\n' \
            'HHR_SPECIALTY_EPISODE_ASSIGNMENT=enabled' \
            'HHR_JEV_CLINICAL_APPROVED=enabled' \
            > functions/.env.hhr-pruebas

      - name: Write service account credentials to disk
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HHR }}
        run: |
          mkdir -p "$RUNNER_TEMP/firebase"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/firebase/service-account.json"
          chmod 600 "$RUNNER_TEMP/firebase/service-account.json"

      - name: Delete retired mirror functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase/service-account.json
        run: |
          set -euo pipefail
          RETIRED_FUNCTIONS=(
            mirrorDailyRecords
            mirrorAuditLogs
            mirrorSettings
            mirrorTransferRequests
            mirrorClinicalDocuments
          )

          for function_name in "${RETIRED_FUNCTIONS[@]}"; do
            echo "Deleting retired Firebase function if present: ${function_name}"
            set +e
            output="$(npx --no-install firebase functions:delete "${function_name}" \
              --project hhr-pruebas \
              --non-interactive \
              --force 2>&1)"
            status=$?
            set -e

            if [ "$status" -ne 0 ]; then
              if printf '%s\n' "$output" | node scripts/check-firebase-function-delete-result.mjs; then
                echo "Retired Firebase function was already absent: ${function_name}"
              else
                echo "$output"
                exit "$status"
              fi
            fi
          done

      - name: Delete orphaned us-central1 copies of the authority callables
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase/service-account.json
        run: |
          set -euo pipefail
          # Las callables de autoridad viven SOLO en southamerica-east1 (región del
          # cliente). Las copias en us-central1 quedaron huérfanas. El planner de
          # `deploy --only` también las retiraría (matchean el filtro por id y
          # llevan la etiqueta deployment-tool), pero salta los borrados si algún
          # upsert falla, y `functions:delete` puede salir con exit 0 aunque el
          # borrado falle. Por eso se borran aquí de forma explícita e idempotente
          # (ausencia = éxito) y el paso de verificación posterior PRUEBA que ya no
          # están listadas.
          ORPHANED_US_CENTRAL1_FUNCTIONS=(
            saveDailyRecordWithClinicalAuthority
            patchDailyRecordWithClinicalAuthority
          )

          for function_name in "${ORPHANED_US_CENTRAL1_FUNCTIONS[@]}"; do
            echo "Deleting orphaned us-central1 copy if present: ${function_name}"
            set +e
            output="$(npx --no-install firebase functions:delete "${function_name}" \
              --region us-central1 \
              --project hhr-pruebas \
              --non-interactive \
              --force 2>&1)"
            status=$?
            set -e

            if [ "$status" -ne 0 ]; then
              if printf '%s\n' "$output" | node scripts/check-firebase-function-delete-result.mjs; then
                echo "Orphaned us-central1 copy was already absent: ${function_name}"
              else
                echo "$output"
                exit "$status"
              fi
            fi
          done

      - name: Deploy functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase/service-account.json
        run: |
          FUNCTION_TARGETS="$(node scripts/list-firebase-function-targets.mjs)"
          echo "Deploying Firebase function targets: ${FUNCTION_TARGETS}"
          npx --no-install firebase deploy \
            --only "${FUNCTION_TARGETS}" \
            --project hhr-pruebas \
            --non-interactive \
            --force

      - name: Verify deployed clinical fast path
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase/service-account.json
        run: |
          npx --no-install firebase functions:list \
            --project hhr-pruebas \
            --json > "$RUNNER_TEMP/firebase/functions-list.json"
          node scripts/check-deployed-firebase-functions.mjs \
            "$RUNNER_TEMP/firebase/functions-list.json" \
            applyRayenClinicalEnrichmentBatch \
            setAdminCudyrResult \
            configureSpecialtyPolicy \
            publishSpecialtyMemory \
            requestSpecialtyJevSuggestion
          # Las callables de autoridad deben vivir en la región del cliente y en
          # ninguna otra: esta es la evidencia de que el borrado surtió efecto.
          node scripts/check-firebase-function-regions.mjs \
            "$RUNNER_TEMP/firebase/functions-list.json" \
            applyRayenClinicalEnrichmentBatch@southamerica-east1 \
            applyRayenClinicalEnrichmentBatch@us-central1 \
            saveDailyRecordWithClinicalAuthority@southamerica-east1 \
            patchDailyRecordWithClinicalAuthority@southamerica-east1 \
            '!saveDailyRecordWithClinicalAuthority@us-central1' \
            '!patchDailyRecordWithClinicalAuthority@us-central1'

      - name: Cleanup credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase/service-account.json"
