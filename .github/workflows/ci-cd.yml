name: CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, develop]
  pull_request:
    # Validate stacked Codex PRs before any parent is merged into main.
    branches: [main, develop, 'codex/**']

# Only a newer revision of the same PR supersedes an existing run.
# Pushes use run_id so every main/develop validation is preserved.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-scope:
    name: ci-scope
    runs-on: ubuntu-latest
    permissions:
      # actions: read lets a main push find the pull request run that tested its tree.
      actions: read
      contents: read
      pull-requests: read
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      reason: ${{ steps.classify.outputs.reason }}
      evidence-run-id: ${{ steps.classify.outputs.evidence_run_id }}
      evidence-run-attempt: ${{ steps.classify.outputs.evidence_run_attempt }}
      evidence-commit: ${{ steps.classify.outputs.evidence_commit }}
      evidence-tree: ${{ steps.classify.outputs.evidence_tree }}

    steps:
      - name: Checkout trusted classifier revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: trusted-ci

      - name: Checkout immutable candidate revision
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Classify CI change scope
        id: classify
        shell: bash
        run: |
          if [[ -f trusted-ci/scripts/classify-ci-change-scope.mjs ]]; then
            cd trusted-ci
            node scripts/classify-ci-change-scope.mjs
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "reason=trusted_classifier_unavailable" >> "$GITHUB_OUTPUT"
            echo "Trusted base does not contain the classifier; running full CI."
          fi
        env:
          CI_GIT_ROOT: ${{ github.workspace }}/candidate
          GITHUB_TOKEN: ${{ github.token }}

      # Every job of a pull request run tests github.sha (refs/pull/N/merge). Its
      # tree, recorded in an artifact name, lets main reuse this run when merging
      # leaves the tree unchanged. Best effort: without it main runs everything.
      - name: Record the tree this run tests
        id: tested
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(gh api "repos/$GITHUB_REPOSITORY/git/commits/$GITHUB_SHA" --jq .tree.sha)"
          [[ "$tree" =~ ^[0-9a-f]{40}$ ]]
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
          echo "$GITHUB_SHA $tree" > "$RUNNER_TEMP/pr-tested.txt"

      - name: Upload the tested tree record
        if: github.event_name == 'pull_request' && steps.tested.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: pr-tested-${{ github.sha }}-${{ steps.tested.outputs.tree }}
          path: ${{ runner.temp }}/pr-tested.txt
          overwrite: true
          retention-days: 7

  docs-scope-gate:
    name: docs-scope-gate
    runs-on: ubuntu-latest
    needs: [ci-scope]

    steps:
      - name: Record full CI scope
        if: needs.ci-scope.outputs.scope != 'docs-only'
        run: echo "Documentation-only validation is not active for this change."

      - name: Checkout code
        if: needs.ci-scope.outputs.scope == 'docs-only'
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        if: needs.ci-scope.outputs.scope == 'docs-only'
        uses: ./.github/actions/setup-ci-dependencies

      - name: Validate documentation contracts
        if: needs.ci-scope.outputs.scope == 'docs-only'
        run: npm run check:docs-drift && npm run check:operational-runbooks

  functions-scope-gate:
    name: functions-scope-gate
    runs-on: ubuntu-latest
    needs: [ci-scope]

    steps:
      - name: Record non-functions CI scope
        if: needs.ci-scope.outputs.scope != 'functions-only'
        run: echo "Functions-only validation is not active for this change."

      - name: Checkout code
        if: needs.ci-scope.outputs.scope == 'functions-only'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: needs.ci-scope.outputs.scope == 'functions-only'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install application test dependencies
        if: needs.ci-scope.outputs.scope == 'functions-only'
        run: npm ci

      - name: Install Firebase Functions dependencies
        if: needs.ci-scope.outputs.scope == 'functions-only'
        run: npm ci --prefix functions

      - name: Run Firebase Functions tests
        if: needs.ci-scope.outputs.scope == 'functions-only'
        run: >-
          npx vitest run src/tests/functions
          src/tests/build/firebaseFunctionDeployVerification.test.ts
          src/tests/build/firebaseFunctionDeleteResult.test.ts
          src/tests/build/firebaseFunctionRegionVerification.test.ts

      - name: Validate serverless contracts and runtime scripts
        if: needs.ci-scope.outputs.scope == 'functions-only'
        run: |
          npm run check:serverless-sensitive-coverage
          npm run check:serverless-runtime-governance
          npm --prefix functions run check:clinical-pdf-runtime

  tooling-scope-gate:
    name: tooling-scope-gate
    runs-on: ubuntu-latest
    needs: [ci-scope]
    steps:
      - name: Record non-tooling CI scope
        if: needs.ci-scope.outputs.scope != 'tooling-only'
        run: echo "Tooling-only validation is not active for this change."
      - name: Checkout immutable candidate
        if: needs.ci-scope.outputs.scope == 'tooling-only'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Setup CI dependencies
        if: needs.ci-scope.outputs.scope == 'tooling-only'
        uses: ./.github/actions/setup-ci-dependencies
      - name: Validate changed file lint and formatting
        if: needs.ci-scope.outputs.scope == 'tooling-only'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          mapfile -d '' files < <(git diff --name-only -z "$BASE_SHA...$HEAD_SHA")
          test "${#files[@]}" -gt 0
          npx eslint --max-warnings 0 --no-warn-ignored -- "${files[@]}"
          npx prettier --check -- "${files[@]}"
      - name: Validate static controls against the repository
        if: needs.ci-scope.outputs.scope == 'tooling-only'
        env:
          FOLDER_BOOK_BASE: ${{ github.event.pull_request.base.sha }}
        run: npm run check:quality
      - name: Check TypeScript types
        if: needs.ci-scope.outputs.scope == 'tooling-only'
        run: npm run typecheck
      - name: Run control and build regression tests
        if: needs.ci-scope.outputs.scope == 'tooling-only'
        run: npx vitest run src/tests/scripts src/tests/build

  critical-coverage-shards:
    name: critical-coverage-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies
      - name: Run critical coverage shard
        run: node scripts/run-critical-coverage.mjs --shard=${{ matrix.shard }}/4
      - name: Upload complete shard 1 report
        if: matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: critical-coverage-shard-1
          path: reports/critical-coverage-blobs/shard-1.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload complete shard 2 report
        if: matrix.shard == 2
        uses: actions/upload-artifact@v7
        with:
          name: critical-coverage-shard-2
          path: reports/critical-coverage-blobs/shard-2.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload complete shard 3 report
        if: matrix.shard == 3
        uses: actions/upload-artifact@v7
        with:
          name: critical-coverage-shard-3
          path: reports/critical-coverage-blobs/shard-3.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload complete shard 4 report
        if: matrix.shard == 4
        uses: actions/upload-artifact@v7
        with:
          name: critical-coverage-shard-4
          path: reports/critical-coverage-blobs/shard-4.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  critical-coverage-report:
    name: critical-coverage-report
    runs-on: ubuntu-latest
    needs: [ci-scope, critical-coverage-shards]
    if: needs.ci-scope.outputs.scope == 'full'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Download same-run shard 1 report
        uses: actions/download-artifact@v7
        with:
          name: critical-coverage-shard-1
          path: reports/critical-coverage-blobs
      - name: Download same-run shard 2 report
        uses: actions/download-artifact@v7
        with:
          name: critical-coverage-shard-2
          path: reports/critical-coverage-blobs
      - name: Download same-run shard 3 report
        uses: actions/download-artifact@v7
        with:
          name: critical-coverage-shard-3
          path: reports/critical-coverage-blobs
      - name: Download same-run shard 4 report
        uses: actions/download-artifact@v7
        with:
          name: critical-coverage-shard-4
          path: reports/critical-coverage-blobs

      - name: Merge coverage without rerunning tests
        run: node scripts/run-critical-coverage.mjs --merge-shards

      - name: Generate and enforce critical coverage artifact
        run: node scripts/report-critical-coverage.mjs && node scripts/check-critical-coverage.mjs

      - name: Upload critical coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: critical-coverage
          path: reports/critical-coverage.*
          retention-days: 30

  quality-static-base:
    name: quality-static-base (${{ matrix.check }})
    runs-on: ubuntu-latest
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        # typecheck natively enforces noUncheckedIndexedAccess on production src/ (tsconfig.prod.json)
        # and netlify/functions/ (tsconfig.netlify.json).
        check: [lint, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies
        with:
          save-cache: ${{ matrix.check == 'lint' && 'true' || 'false' }}

      - name: Run release-blocking static check
        run: npm run ${{ matrix.check }} ${{ matrix.check == 'lint' && '-- --max-warnings 0 --concurrency 2' || '' }}

      # scripts/tests/*.test.mjs cover the local tooling (check:changed, test:changed, reports).
      - name: Run the tooling scripts' own tests
        if: matrix.check == 'lint'
        run: npm run test:scripts

  quality-static-groups:
    name: quality-static-${{ matrix.group }}
    runs-on: ubuntu-latest
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        group: [boundaries, governance, security, size, tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The pull request merge commit and its base parent: check:folder-dependencies
          # compares its exceptions book with the base so the book only shrinks.
          fetch-depth: 2

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Run quality static group
        env:
          FOLDER_BOOK_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
        run: npm run check:quality:group -- ${{ matrix.group }}

      - name: Upload quality static profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-static-profile-${{ matrix.group }}
          path: reports/ci-quality-static-profile-${{ matrix.group }}.*
          retention-days: 30

  quality-static:
    name: quality-static
    runs-on: ubuntu-latest
    needs: [quality-static-base, critical-coverage-report, quality-static-groups]

    steps:
      - name: Quality static gates passed
        run: |
          echo "quality-static-base: passed"
          echo "critical-coverage-report: passed"
          echo "quality-static groups: passed"

  clinical-sync-release-gate:
    name: clinical-sync-release-gate
    runs-on: ubuntu-latest
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Run clinical sync simulator
        run: npm run test:clinical-sync-simulator
        env:
          CI: true

      - name: Generate sync convergence evidence
        run: npm run report:sync-convergence

      - name: Validate sync convergence evidence contract
        run: npm run check:sync-convergence-evidence

      - name: Enforce sync convergence evidence freshness
        run: npm run check:report-freshness:strict -- --only sync-convergence

      - name: Upload sync convergence evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-convergence
          path: reports/sync-convergence.*
          retention-days: 30

  unit-risk-shards:
    name: unit-risk-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Run unit shard
        run: >-
          node scripts/report-test-execution-manifest.mjs
          --capture vitest --suite unit-${{ matrix.shard }}
          --report reports/execution/unit-${{ matrix.shard }}.raw.json
          --output reports/execution/unit-${{ matrix.shard }}.evidence.json
          -- npm run test:ci:unit:shard -- ${{ matrix.shard }}/4
          --reporter=default --reporter=json
          --outputFile=reports/execution/unit-${{ matrix.shard }}.raw.json
        env:
          CI: true

      - name: Upload unit 1 execution evidence
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: test-execution-evidence-unit-1
          path: reports/execution/unit-1.evidence.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload unit 2 execution evidence
        if: always() && matrix.shard == 2
        uses: actions/upload-artifact@v7
        with:
          name: test-execution-evidence-unit-2
          path: reports/execution/unit-2.evidence.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload unit 3 execution evidence
        if: always() && matrix.shard == 3
        uses: actions/upload-artifact@v7
        with:
          name: test-execution-evidence-unit-3
          path: reports/execution/unit-3.evidence.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload unit 4 execution evidence
        if: always() && matrix.shard == 4
        uses: actions/upload-artifact@v7
        with:
          name: test-execution-evidence-unit-4
          path: reports/execution/unit-4.evidence.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload test coverage shard artifact (optional)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.shard }}
          path: coverage/
          retention-days: 7
        continue-on-error: true

  unit-risk:
    name: unit-risk
    runs-on: ubuntu-latest
    needs: [unit-risk-shards]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Prove critical risk packs are included in the unit suite
        run: npm run check:ci-risk-pack-membership

      - name: Enforce test runtime governance contract
        run: npm run check:test-runtime-governance

      - name: Generate test runtime governance evidence
        run: npm run report:test-runtime-governance

      - name: Enforce test run contract
        run: |
          echo "Unit/integration test suite completed through unit-risk-shards (without emulator-only suites)."
          echo "Critical risk packs remain covered by check:ci-risk-pack-membership."
          echo "Firestore rules + emulator sync/UI suites are enforced in dedicated firestore-rules job."

      - name: Upload test runtime governance artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-runtime-governance
          path: reports/test-runtime-governance.*
          retention-days: 30

  rules-emulator:
    name: rules-emulator
    runs-on: ubuntu-24.04
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The cache key includes the runner image, so ubuntu-24.04 jobs need their
      # own pristine writer; lint only fills the ubuntu-latest key.
      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies
        with:
          save-cache: 'true'

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare verified Firestore emulator artifact
        uses: ./.github/actions/setup-ci-firestore-emulator

      - name: Run Firestore rules tests with emulator
        run: npm run test:rules:ci
        env:
          CI: true
          RUN_FIRESTORE_RULES_TESTS: 1

      - name: Run clinical attachment Storage rules tests with emulators
        run: >-
          node scripts/report-test-execution-manifest.mjs
          --capture vitest --suite storage
          --report reports/execution/storage.raw.json
          --output reports/execution/storage.evidence.json
          -- npm run test:storage-rules:ci
        env:
          CI: true

      # The emulator UI suite runs in emulator-ui, in parallel, with its own emulator.
      - name: Run Firestore emulator sync suite
        run: npm run test:emulator:sync:ci -- --suite sync
        env:
          CI: true
          RUN_FIRESTORE_EMULATOR_TESTS: 1

      - name: Upload Storage execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-execution-evidence-storage
          path: reports/execution/storage.evidence.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Chromium for individual account browser flow
        uses: ./.github/actions/setup-ci-chromium
        timeout-minutes: 15

      - name: Validate individual accounts with Auth, Firestore and Storage emulators
        run: npm run test:accounts:emulator:ci

  # Split from rules-emulator so the two halves of the emulator family run side by side.
  emulator-ui:
    name: emulator-ui
    runs-on: ubuntu-24.04
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare verified Firestore emulator artifact
        uses: ./.github/actions/setup-ci-firestore-emulator

      - name: Run Firestore emulator UI suite
        run: npm run test:emulator:sync:ci -- --suite ui
        env:
          CI: true
          RUN_FIRESTORE_EMULATOR_TESTS: 1

  e2e-critical-lanes:
    name: e2e-critical lane ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: ['1', '2', '3']
    runs-on: ubuntu-24.04
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare verified Firestore emulator artifact
        uses: ./.github/actions/setup-ci-firestore-emulator

      - name: Install Playwright browser for critical E2E gate
        uses: ./.github/actions/setup-ci-chromium
        timeout-minutes: 15

      - name: Fetch pinned previous extension release
        if: matrix.lane == '3'
        run: git fetch --depth=1 origin d0af164e076619f593433c53ad398581b92a6979

      - name: Validate the packaged Rayen extension in Chromium
        if: matrix.lane == '3'
        run: npm run test:e2e:rayen-extension-runtime

      - name: Validate inline DAU login with synthetic API and production CSP
        if: matrix.lane == '3'
        run: npm run test:e2e:urgency-dau-login

      - name: Validate 0.48.56 to current extension upgrade with open tabs
        if: matrix.lane == '3'
        run: npm run test:e2e:rayen-extension-upgrade

      - name: Validate shared offscreen lifecycle in Chromium
        if: matrix.lane == '3'
        run: npm run test:e2e:shared-offscreen

      - name: Run critical E2E suite with Firestore emulator
        run: >-
          node scripts/report-test-execution-manifest.mjs
          --capture playwright --suite critical-${{ matrix.lane }}
          --report reports/e2e/critical-playwright-report.json
          --output reports/execution/critical-${{ matrix.lane }}.evidence.json
          -- npm run test:e2e:critical:ci -- ${{ matrix.lane }}
        env:
          CI: true
          E2E_CRITICAL_BROWSERS: chromium
          PLAYWRIGHT_JSON_OUTPUT: reports/e2e/critical-playwright-report.json
          E2E_FLOW_PLAYWRIGHT_JSON_OUTPUT: reports/e2e/flow-performance-playwright-report.json
          E2E_BUDGET_LOGIN_VISIBLE_MS: 4500
          E2E_BUDGET_AUTH_FEEDBACK_MS: 3000
          E2E_BUDGET_CENSO_VISIBLE_MS: 8000

      - name: Run integrated CUDYR flow with a fresh Firestore emulator
        if: matrix.lane == '3'
        run: >-
          node scripts/report-test-execution-manifest.mjs
          --capture playwright --suite cudyr
          --report reports/e2e/cudyr-playwright-report.json
          --output reports/execution/cudyr.evidence.json
          -- npm run test:e2e:cudyr-flow:ci
        env:
          CI: true
          E2E_CRITICAL_BROWSERS: chromium

      - name: Verify authenticated census read against local emulators
        if: matrix.lane == '3'
        run: npm run test:e2e:census-remote-performance
        env:
          CI: true

      - name: Upload isolated lane 1 evidence and diagnostics
        if: always() && matrix.lane == '1'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-critical-lane-${{ github.run_attempt }}-1
          path: |
            reports/e2e/**
            reports/execution/**
            playwright-report/**
            test-results/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload isolated lane 2 evidence and diagnostics
        if: always() && matrix.lane == '2'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-critical-lane-${{ github.run_attempt }}-2
          path: |
            reports/e2e/**
            reports/execution/**
            playwright-report/**
            test-results/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload isolated lane 3 evidence and diagnostics
        if: always() && matrix.lane == '3'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-critical-lane-${{ github.run_attempt }}-3
          path: |
            reports/e2e/**
            reports/execution/**
            playwright-report/**
            test-results/**
          if-no-files-found: error
          retention-days: 14

  build:
    name: build-budget
    runs-on: ubuntu-24.04
    # Runs immediately after ci-scope alongside the other release gates; every
    # downstream consumer (smoke lanes, Lighthouse, post-merge) reuses this dist.
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Validate Netlify mail budgets and runtime artifacts
        run: npm run check:netlify-functions-bundle

      - name: Upload Netlify mail runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: netlify-mail-runtime
          path: |
            reports/netlify-mail-runtime.json
            reports/netlify-mail-runtime.md
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Enforce bundle budget
        run: npm run check:bundle-budget

      - name: Validate chunk import graph (no vendor↔feature cycles)
        run: npm run check:chunk-graph

      - name: Validate runtime asset margin
        run: npm run check:runtime-asset-margin

      - name: Upload production build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  preview-smoke-lanes:
    # Lanes are split by observed duration; see scripts/previewSmokeLaneSupport.mjs.
    # They run even when build fails, only to fail visibly: a lane skipped
    # for a missing bundle would look green in the checks list.
    name: preview-smoke-lane (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    needs: [ci-scope, build]
    if: ${{ !cancelled() && needs.ci-scope.outputs.scope == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        lane: [app, dicom-graphics-stress, dicom-1, dicom-2, dicom-3, dicom-4, dicom-5]

    steps:
      - name: Require the shared production bundle
        if: needs.build.result != 'success'
        run: |
          echo "::error::build-budget ended as '${{ needs.build.result }}'; this lane has no bundle to test."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Download production bundle
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Install Playwright browsers for preview bootstrap smoke
        uses: ./.github/actions/setup-ci-chromium
        timeout-minutes: 15

      - name: Run preview smoke lane
        run: node scripts/run-preview-smoke-lane.mjs --lane=${{ matrix.lane }}
        env:
          CI: true

      - name: Upload app lane report
        if: always() && matrix.lane == 'app'
        uses: actions/upload-artifact@v7
        with:
          # archive: false names the artifact after the file; keep both equal.
          name: preview-smoke-blob-app.zip
          path: reports/e2e/preview-blobs/app/preview-smoke-blob-app.zip
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload dicom-graphics-stress lane report
        if: always() && matrix.lane == 'dicom-graphics-stress'
        uses: actions/upload-artifact@v7
        with:
          # archive: false names the artifact after the file; keep both equal.
          name: preview-smoke-blob-dicom-graphics-stress.zip
          path: reports/e2e/preview-blobs/dicom-graphics-stress/preview-smoke-blob-dicom-graphics-stress.zip
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload dicom-1 lane report
        if: always() && matrix.lane == 'dicom-1'
        uses: actions/upload-artifact@v7
        with:
          # archive: false names the artifact after the file; keep both equal.
          name: preview-smoke-blob-dicom-1.zip
          path: reports/e2e/preview-blobs/dicom-1/preview-smoke-blob-dicom-1.zip
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload dicom-2 lane report
        if: always() && matrix.lane == 'dicom-2'
        uses: actions/upload-artifact@v7
        with:
          # archive: false names the artifact after the file; keep both equal.
          name: preview-smoke-blob-dicom-2.zip
          path: reports/e2e/preview-blobs/dicom-2/preview-smoke-blob-dicom-2.zip
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload dicom-3 lane report
        if: always() && matrix.lane == 'dicom-3'
        uses: actions/upload-artifact@v7
        with:
          # archive: false names the artifact after the file; keep both equal.
          name: preview-smoke-blob-dicom-3.zip
          path: reports/e2e/preview-blobs/dicom-3/preview-smoke-blob-dicom-3.zip
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload dicom-4 lane report
        if: always() && matrix.lane == 'dicom-4'
        uses: actions/upload-artifact@v7
        with:
          # archive: false names the artifact after the file; keep both equal.
          name: preview-smoke-blob-dicom-4.zip
          path: reports/e2e/preview-blobs/dicom-4/preview-smoke-blob-dicom-4.zip
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload dicom-5 lane report
        if: always() && matrix.lane == 'dicom-5'
        uses: actions/upload-artifact@v7
        with:
          # archive: false names the artifact after the file; keep both equal.
          name: preview-smoke-blob-dicom-5.zip
          path: reports/e2e/preview-blobs/dicom-5/preview-smoke-blob-dicom-5.zip
          archive: false
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # The single job between the work jobs and ci-summary: it merges the preview and critical
  # E2E lanes, builds the test execution manifest and regenerates confidence. One job pays
  # the checkout and dependency setup once, instead of a chain of four jobs.
  # It also runs when lanes fail, so their merged reports and diagnostics are still uploaded.
  final-confidence-and-readiness:
    name: final-confidence-and-readiness
    runs-on: ubuntu-latest
    needs:
      [
        ci-scope,
        critical-coverage-report,
        build,
        unit-risk-shards,
        rules-emulator,
        e2e-critical-lanes,
        preview-smoke-lanes,
      ]
    if: ${{ !cancelled() && needs.ci-scope.outputs.scope == 'full' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      # Blobs are already zips. Zipping them again let download-artifact's streaming
      # unzip mistake the inner data-descriptor signature for the end of the entry
      # and fail on intact artifacts; v8 with skip-decompress stores them as-is.
      - name: Download same-run app lane report
        uses: actions/download-artifact@v8
        with:
          name: preview-smoke-blob-app.zip
          path: reports/e2e/preview-blobs
          skip-decompress: true
      - name: Download same-run dicom-graphics-stress lane report
        uses: actions/download-artifact@v8
        with:
          name: preview-smoke-blob-dicom-graphics-stress.zip
          path: reports/e2e/preview-blobs
          skip-decompress: true
      - name: Download same-run dicom-1 lane report
        uses: actions/download-artifact@v8
        with:
          name: preview-smoke-blob-dicom-1.zip
          path: reports/e2e/preview-blobs
          skip-decompress: true
      - name: Download same-run dicom-2 lane report
        uses: actions/download-artifact@v8
        with:
          name: preview-smoke-blob-dicom-2.zip
          path: reports/e2e/preview-blobs
          skip-decompress: true
      - name: Download same-run dicom-3 lane report
        uses: actions/download-artifact@v8
        with:
          name: preview-smoke-blob-dicom-3.zip
          path: reports/e2e/preview-blobs
          skip-decompress: true
      - name: Download same-run dicom-4 lane report
        uses: actions/download-artifact@v8
        with:
          name: preview-smoke-blob-dicom-4.zip
          path: reports/e2e/preview-blobs
          skip-decompress: true
      - name: Download same-run dicom-5 lane report
        uses: actions/download-artifact@v8
        with:
          name: preview-smoke-blob-dicom-5.zip
          path: reports/e2e/preview-blobs
          skip-decompress: true

      - name: Merge census and clinical library preview lanes
        run: npx playwright merge-reports --config playwright.preview-merge.config.ts reports/e2e/preview-blobs
        env:
          PLAYWRIGHT_PREVIEW_ARTIFACTS_DIR: reports/e2e/preview-bootstrap

      - name: Summarize census and library results
        if: always()
        run: node scripts/report-preview-summary.mjs

      - name: Enforce every preview lane passed
        run: test "$PREVIEW_LANES_RESULT" = success
        env:
          PREVIEW_LANES_RESULT: ${{ needs['preview-smoke-lanes'].result }}

      - name: Prove every canonical preview test ran exactly once
        run: node scripts/check-preview-smoke-completeness.mjs

      - name: Enforce preview bootstrap report artifact
        run: test -f reports/e2e/preview-bootstrap/report.json

      - name: Record preview bootstrap artifact provenance
        run: npm run write:preview-bootstrap-provenance

      - name: Validate preview bootstrap artifact evidence
        run: npm run check:preview-bootstrap-evidence

      - name: Upload preview bootstrap artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-bootstrap-artifacts
          path: reports/e2e/preview-bootstrap/
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      # The critical lanes are merged even when the preview failed, so their diagnostics
      # are uploaded. Every attempt of this run: re-running failed jobs repeats only the
      # failed lane, and the merge takes each lane's newest attempt.
      - name: Download lane evidence from every attempt of this run
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v7
        with:
          pattern: e2e-critical-lane-*
          path: reports/critical-lanes
      - name: Require all lanes and merge original execution evidence
        id: e2e-merge
        if: ${{ !cancelled() }}
        env:
          LANES_RESULT: ${{ needs.e2e-critical-lanes.result }}
        run: |
          test "$LANES_RESULT" = success
          node scripts/merge-critical-e2e-lanes.mjs
      - name: Generate and enforce E2E operational metrics
        id: e2e-metrics
        if: always()
        run: node scripts/report-e2e-operational-metrics.mjs reports/e2e/critical-playwright-report.json --enforce

      - name: Upload flow performance evidence
        if: ${{ !cancelled() && steps.e2e-merge.outcome == 'success' && steps.e2e-metrics.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: flow-performance-evidence
          path: |
            reports/e2e/flow-performance-budget.json
            reports/e2e/flow-performance-budget-summary.json
            reports/e2e/flow-performance-budget.md
            reports/e2e/flow-performance-playwright-report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      # reports/execution keeps the merged critical, flow and CUDYR evidence the manifest reads.
      - name: Upload E2E critical artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-critical-emulator-artifacts
          path: |
            reports/e2e/**
            reports/execution/critical.evidence.json
            reports/execution/flow.evidence.json
            reports/execution/cudyr.evidence.json
            playwright-report/**
            test-results/**
            reports/critical-lanes/**
          retention-days: 14

      # The manifest needs only the merged lanes, so it is still built when the preview failed.
      - name: Download same-run unit and storage execution evidence
        if: ${{ !cancelled() && steps.e2e-merge.outcome == 'success' }}
        uses: actions/download-artifact@v7
        with:
          pattern: test-execution-evidence-*
          path: reports/execution
          merge-multiple: true
      - name: Require all eight execution reports and validate provenance
        if: ${{ !cancelled() && steps.e2e-merge.outcome == 'success' }}
        shell: bash
        run: |
          inputs=()
          for suite in unit-1 unit-2 unit-3 unit-4 storage critical flow cudyr; do
            evidence="reports/execution/$suite.evidence.json"
            test -f "$evidence" || { echo "::error::Missing $suite execution evidence"; exit 1; }
            inputs+=(--input "$evidence")
          done
          npm run report:test-execution-manifest -- "${inputs[@]}"
      - name: Upload execution manifest
        if: ${{ !cancelled() && steps.e2e-merge.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-execution-manifest
          path: reports/test-execution-manifest.*
          overwrite: true
          if-no-files-found: error
          retention-days: 30

      # Flake risk counts the test files that failed or needed a retry in this manifest.
      - name: Require the build and critical coverage of this run
        run: test "$BUILD_RESULT" = success && test "$CRITICAL_COVERAGE_RESULT" = success
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CRITICAL_COVERAGE_RESULT: ${{ needs['critical-coverage-report'].result }}

      - name: Download critical coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: critical-coverage
          path: reports

      - name: Download production build
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Validate flow performance evidence
        run: |
          node scripts/check-playwright-report-clean.mjs reports/e2e/flow-performance-playwright-report.json --label flow-performance
          npm run check:flow-performance-budget

      - name: Regenerate operational health from final runtime evidence
        run: npm run report:operational-health

      - name: Enforce final operational health freshness
        run: npm run check:report-freshness:strict -- --only operational-health

      - name: Upload final operational health + flow evidence artifacts
        uses: actions/upload-artifact@v7
        with:
          name: confidence-and-readiness
          path: |
            reports/operational-health.*
            reports/e2e/preview-bootstrap/ci-provenance.json
            reports/e2e/flow-performance-budget.json
            reports/e2e/flow-performance-budget-summary.json
            reports/e2e/flow-performance-playwright-report.json
          retention-days: 30
  census-startup-performance:
    name: census-startup-performance (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'
    # Ceiling for a pathologically slow startup, not an expectation.
    # Observed: production ~4 min, development ~13 min.
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        environment: [development, production]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies
      - name: Install Chromium
        uses: ./.github/actions/setup-ci-chromium
        timeout-minutes: 15
      - name: Measure populated census navigations per scenario
        run: npm run test:e2e:census-performance
        env:
          CENSUS_PERF_ENV: ${{ matrix.environment }}
          CENSUS_PERF_INCLUDE_INTERACTIONS: ${{ matrix.environment == 'production' && '1' || '0' }}
          # Pull requests run a small screening sample for fast feedback. Pushes keep
          # the release-quality 30-sample measurement used as a valid baseline.
          CENSUS_PERF_SAMPLES: ${{ github.event_name == 'pull_request' && '5' || '30' }}
          CENSUS_PERF_SMOKE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          CENSUS_PERF_RUNNER: github-ubuntu-latest
      - name: Upload privacy-safe timing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: census-startup-performance-${{ matrix.environment }}
          path: |
            reports/e2e/census-performance-*.json
            test-results/census-performance/**
            test-results/census-interactions/**
          retention-days: 30
          if-no-files-found: warn

  lighthouse-ci:
    # Performance instrumentation. Warn-only — assertions in lighthouserc.json
    # use "warn" severity so this job surfaces trends in the PR/run summary
    # without blocking releases. Promote individual assertions to "error"
    # only once the team has agreed on a budget that the current bundle
    # actually meets.
    name: lighthouse-ci
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      # Measure the exact bundle already validated by build-budget in this run.
      - name: Download validated production build
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  ci-runtime-telemetry:
    name: ci-runtime-telemetry
    runs-on: ubuntu-latest
    needs:
      [
        quality-static,
        unit-risk,
        clinical-sync-release-gate,
        rules-emulator,
        e2e-critical-lanes,
        build,
      ]
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # These telemetry scripts use only Node.js built-ins and the GitHub API.
      - name: Collect GitHub Actions runtime data
        run: npm run collect:ci-runtime-observed-input
        env:
          CI_RUNTIME_COLLECTION_REQUIRED: '1'
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate observed CI runtime telemetry evidence
        run: npm run report:ci-runtime-observed-profile

      - name: Enforce observed CI runtime telemetry contract
        run: npm run check:ci-runtime-telemetry

      - name: Upload observed CI runtime telemetry artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-observed-profile
          path: reports/ci-runtime-observed-*
          retention-days: 30

  ci-strict-summary:
    name: ci-summary
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions: {}
    needs:
      [
        ci-scope,
        docs-scope-gate,
        functions-scope-gate,
        tooling-scope-gate,
        quality-static,
        unit-risk,
        clinical-sync-release-gate,
        rules-emulator,
        emulator-ui,
        e2e-critical-lanes,
        build,
        preview-smoke-lanes,
        final-confidence-and-readiness,
        ci-runtime-telemetry,
        census-startup-performance,
      ]
    env:
      CI_SCOPE_RESULT: ${{ needs['ci-scope'].result }}
      CI_SCOPE: ${{ needs['ci-scope'].outputs.scope }}
      DOCS_SCOPE_GATE_RESULT: ${{ needs['docs-scope-gate'].result }}
      FUNCTIONS_SCOPE_GATE_RESULT: ${{ needs['functions-scope-gate'].result }}
      TOOLING_SCOPE_GATE_RESULT: ${{ needs['tooling-scope-gate'].result }}
      QUALITY_STATIC_RESULT: ${{ needs['quality-static'].result }}
      UNIT_RISK_RESULT: ${{ needs['unit-risk'].result }}
      CLINICAL_SYNC_RESULT: ${{ needs['clinical-sync-release-gate'].result }}
      RULES_EMULATOR_RESULT: ${{ needs['rules-emulator'].result }}
      EMULATOR_UI_RESULT: ${{ needs['emulator-ui'].result }}
      E2E_CRITICAL_RESULT: ${{ needs['e2e-critical-lanes'].result }}
      BUILD_RESULT: ${{ needs.build.result }}
      PREVIEW_SMOKE_RESULT: ${{ needs['preview-smoke-lanes'].result }}
      FINAL_CONFIDENCE_RESULT: ${{ needs['final-confidence-and-readiness'].result }}
      CI_RUNTIME_TELEMETRY_RESULT: ${{ needs['ci-runtime-telemetry'].result }}
      CENSUS_PERFORMANCE_RESULT: ${{ needs['census-startup-performance'].result }}
      CI_EVIDENCE_RUN_ID: ${{ needs['ci-scope'].outputs.evidence-run-id }}
      CI_EVIDENCE_RUN_ATTEMPT: ${{ needs['ci-scope'].outputs.evidence-run-attempt }}
      CI_EVIDENCE_COMMIT: ${{ needs['ci-scope'].outputs.evidence-commit }}
      CI_EVIDENCE_TREE: ${{ needs['ci-scope'].outputs.evidence-tree }}
    steps:
      - name: Enforce strict gate outcomes
        shell: bash
        run: |
          failures=0

          if [[ "$CI_SCOPE_RESULT" != "success" || "$DOCS_SCOPE_GATE_RESULT" != "success" || "$FUNCTIONS_SCOPE_GATE_RESULT" != "success" || "$TOOLING_SCOPE_GATE_RESULT" != "success" ]]; then
            echo "::error::CI scope classification or focused validation did not pass."
            exit 1
          fi

          case "$CI_SCOPE" in
            full|docs-only|functions-only|tooling-only|reused) ;;
            *) echo "::error::Unknown CI scope: $CI_SCOPE"; exit 1 ;;
          esac

          expected_result="success"
          if [[ "$CI_SCOPE" == "docs-only" || "$CI_SCOPE" == "functions-only" || "$CI_SCOPE" == "tooling-only" || "$CI_SCOPE" == "reused" ]]; then
            expected_result="skipped"
          fi

          # A main push whose tree a complete green pull request run already
          # tested takes that run's evidence instead of repeating it.
          if [[ "$CI_SCOPE" == "reused" ]]; then
            if [[ ! "$CI_EVIDENCE_RUN_ID" =~ ^[0-9]+$ || ! "$CI_EVIDENCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ || ! "$CI_EVIDENCE_COMMIT" =~ ^[0-9a-f]{40}$ || ! "$CI_EVIDENCE_TREE" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::Reused CI evidence does not name its run, attempt, commit and tree."
              exit 1
            fi
            evidence_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$CI_EVIDENCE_RUN_ID"
            {
              echo "### Evidencia reutilizada"
              echo "El árbol de \`$GITHUB_SHA\` es el que probó la corrida [$CI_EVIDENCE_RUN_ID]($evidence_url), intento $CI_EVIDENCE_RUN_ATTEMPT"
              echo "(commit probado \`$CI_EVIDENCE_COMMIT\`, árbol \`$CI_EVIDENCE_TREE\`), completa y en verde."
              echo "Sus pruebas y artefactos acreditan este commit; aquí no se repiten."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          for gate in \
            "quality-static:$QUALITY_STATIC_RESULT" \
            "unit-risk:$UNIT_RISK_RESULT" \
            "clinical-sync-release-gate:$CLINICAL_SYNC_RESULT" \
            "rules-emulator:$RULES_EMULATOR_RESULT" \
            "emulator-ui:$EMULATOR_UI_RESULT" \
            "e2e-critical-lanes:$E2E_CRITICAL_RESULT" \
            "build:$BUILD_RESULT" \
            "preview-smoke-lanes:$PREVIEW_SMOKE_RESULT" \
            "final-confidence-and-readiness:$FINAL_CONFIDENCE_RESULT" \
            "ci-runtime-telemetry:$CI_RUNTIME_TELEMETRY_RESULT" \
            "census-startup-performance:$CENSUS_PERFORMANCE_RESULT"
          do
            name="${gate%%:*}"
            result="${gate#*:}"
            echo "$name: $result"

            if [[ "$result" != "$expected_result" ]]; then
              failures=$((failures + 1))
            fi
          done

          if (( failures > 0 )); then
            echo "::error::$failures CI gate(s) did not match the required $CI_SCOPE scope outcome."
            exit 1
          fi

  postmerge-evidence:
    name: postmerge-evidence
    runs-on: ubuntu-latest
    # ci-summary passing proves the producers passed, or that their evidence is reused.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-strict-summary.result == 'success' }}
    needs: [ci-scope, build, ci-strict-summary, final-confidence-and-readiness]
    permissions:
      actions: read
      contents: read
    # Set only when main reuses a pull request run: artifacts come from that run
    # and its commit counts as current while its tree is HEAD's tree.
    env:
      CI_EVIDENCE_RUN_ID: ${{ needs.ci-scope.outputs.evidence-run-id }}
      CI_EVIDENCE_RUN_ATTEMPT: ${{ needs.ci-scope.outputs.evidence-run-attempt }}
      CI_EVIDENCE_COMMIT: ${{ needs.ci-scope.outputs.evidence-commit }}
      CI_EVIDENCE_TREE: ${{ needs.ci-scope.outputs.evidence-tree }}
      EVIDENCE_RUN_ID: ${{ needs.ci-scope.outputs.evidence-run-id || github.run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Reused-evidence main pushes skip quality-static-base (lint), so postmerge-evidence
      # publishes main's ubuntu-latest installed-v1 cache without racing lint on PRs or full runs.
      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies
        with:
          save-cache: 'true'

      - name: Validate CI artifact contract
        run: npm run check:ci-artifact-contracts

      - name: Verify build artifact availability
        run: node scripts/verify-github-run-artifact.mjs --artifact dist --producer build-budget
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify preview bootstrap artifact availability
        run: node scripts/verify-github-run-artifact.mjs --artifact preview-bootstrap-artifacts --producer final-confidence-and-readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify critical coverage artifact availability
        run: node scripts/verify-github-run-artifact.mjs --artifact critical-coverage --producer critical-coverage-report
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ env.EVIDENCE_RUN_ID }}
          github-token: ${{ github.token }}
          name: dist
          path: dist

      - name: Download preview bootstrap artifacts
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ env.EVIDENCE_RUN_ID }}
          github-token: ${{ github.token }}
          name: preview-bootstrap-artifacts
          path: reports/e2e/preview-bootstrap

      - name: Download critical coverage artifact
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ env.EVIDENCE_RUN_ID }}
          github-token: ${{ github.token }}
          name: critical-coverage
          path: reports

      - name: Validate downloaded preview bootstrap evidence
        run: npm run check:preview-bootstrap-evidence

      - name: Download flow performance evidence
        uses: actions/download-artifact@v7
        with:
          run-id: ${{ env.EVIDENCE_RUN_ID }}
          github-token: ${{ github.token }}
          name: flow-performance-evidence
          path: reports/e2e

      - name: Validate downloaded flow performance evidence
        run: |
          node scripts/check-playwright-report-clean.mjs reports/e2e/flow-performance-playwright-report.json --label flow-performance
          npm run check:flow-performance-budget

      - name: Generate post-merge release evidence
        run: npm run postmerge:evidence

      - name: Verify post-merge release evidence
        run: npm run check:postmerge-evidence:strict

      - name: Upload post-merge release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postmerge-release-evidence
          path: |
            reports/postmerge-evidence.*
            reports/operational-health.*
          retention-days: 30

  function-deploy-scope:
    name: function-deploy-scope
    needs: [ci-strict-summary]
    # `!cancelled()` is required: without a status function GitHub skips this job whenever
    # any ancestor was skipped, which is every gate on a main push that reuses evidence.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-strict-summary.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      # Reads earlier main runs so a failed deployment is retried by the next push.
      actions: read
      contents: read
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Functions-related changes
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-function-deployment-ci.mjs --scope

  deploy-functions:
    name: validated-functions-deployment
    needs: [ci-strict-summary, function-deploy-scope]
    if: ${{ !cancelled() && needs.ci-strict-summary.result == 'success' && needs.function-deploy-scope.result == 'success' && needs.function-deploy-scope.outputs.changed == 'true' }}
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-functions.yml
    secrets:
      FIREBASE_SERVICE_ACCOUNT_HHR: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HHR }}

  # A skipped main-only job leaves the run green (see mainOnlyJobViolations). This job
  # reads what the jobs really did and turns the run red when one did not run as
  # ci-summary's result requires. Not required by the ruleset: ci-summary stays the gate.
  main-only-jobs:
    name: main-only-jobs
    needs: [ci-strict-summary, function-deploy-scope, deploy-functions, postmerge-evidence]
    # `!cancelled()` runs it after skipped or failed ancestors; a cancelled run stays cancelled.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the main-only jobs ran
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: node scripts/check-main-only-jobs.mjs
