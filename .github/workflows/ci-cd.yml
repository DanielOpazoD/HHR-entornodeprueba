name: CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Only a newer revision of the same PR supersedes an existing run.
# Pushes use run_id so every main/develop validation is preserved.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-scope:
    name: ci-scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      reason: ${{ steps.classify.outputs.reason }}

    steps:
      - name: Checkout trusted classifier revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          path: trusted-ci

      - name: Checkout immutable candidate revision
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate

      - name: Classify CI change scope
        id: classify
        shell: bash
        run: |
          if [[ -f trusted-ci/scripts/classify-ci-change-scope.mjs ]]; then
            cd trusted-ci
            node scripts/classify-ci-change-scope.mjs
          else
            echo "scope=full" >> "$GITHUB_OUTPUT"
            echo "reason=trusted_classifier_unavailable" >> "$GITHUB_OUTPUT"
            echo "Trusted base does not contain the classifier; running full CI."
          fi
        env:
          CI_GIT_ROOT: ${{ github.workspace }}/candidate

  docs-scope-gate:
    name: docs-scope-gate
    runs-on: ubuntu-latest
    needs: [ci-scope]

    steps:
      - name: Record full CI scope
        if: needs.ci-scope.outputs.scope != 'docs-only'
        run: echo "Documentation-only validation is not active for this change."

      - name: Checkout code
        if: needs.ci-scope.outputs.scope == 'docs-only'
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        if: needs.ci-scope.outputs.scope == 'docs-only'
        uses: ./.github/actions/setup-ci-dependencies

      - name: Validate documentation contracts
        if: needs.ci-scope.outputs.scope == 'docs-only'
        run: npm run check:docs-drift && npm run check:operational-runbooks

  functions-scope-gate:
    name: functions-scope-gate
    runs-on: ubuntu-latest
    needs: [ci-scope]

    steps:
      - name: Record non-functions CI scope
        if: needs.ci-scope.outputs.scope != 'functions-only'
        run: echo "Functions-only validation is not active for this change."

      - name: Checkout code
        if: needs.ci-scope.outputs.scope == 'functions-only'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: needs.ci-scope.outputs.scope == 'functions-only'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Install application test dependencies
        if: needs.ci-scope.outputs.scope == 'functions-only'
        run: npm ci

      - name: Install Firebase Functions dependencies
        if: needs.ci-scope.outputs.scope == 'functions-only'
        run: npm ci --prefix functions

      - name: Run Firebase Functions tests
        if: needs.ci-scope.outputs.scope == 'functions-only'
        run: >-
          npx vitest run src/tests/functions
          src/tests/build/firebaseFunctionDeployVerification.test.ts
          src/tests/build/firebaseFunctionDeleteResult.test.ts
          src/tests/build/firebaseFunctionRegionVerification.test.ts

      - name: Validate serverless contracts and runtime scripts
        if: needs.ci-scope.outputs.scope == 'functions-only'
        run: |
          npm run check:serverless-sensitive-coverage
          npm run check:serverless-runtime-governance
          npm --prefix functions run check:clinical-pdf-runtime

  critical-coverage-shards:
    name: critical-coverage-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies
      - name: Run critical coverage shard
        run: node scripts/run-critical-coverage.mjs --shard=${{ matrix.shard }}/4
      - name: Upload complete shard 1 report
        if: matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: critical-coverage-shard-1
          path: reports/critical-coverage-blobs/shard-1.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload complete shard 2 report
        if: matrix.shard == 2
        uses: actions/upload-artifact@v7
        with:
          name: critical-coverage-shard-2
          path: reports/critical-coverage-blobs/shard-2.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload complete shard 3 report
        if: matrix.shard == 3
        uses: actions/upload-artifact@v7
        with:
          name: critical-coverage-shard-3
          path: reports/critical-coverage-blobs/shard-3.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload complete shard 4 report
        if: matrix.shard == 4
        uses: actions/upload-artifact@v7
        with:
          name: critical-coverage-shard-4
          path: reports/critical-coverage-blobs/shard-4.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  critical-coverage-report:
    name: critical-coverage-report
    runs-on: ubuntu-latest
    needs: [ci-scope, critical-coverage-shards]
    if: needs.ci-scope.outputs.scope == 'full'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Download same-run shard 1 report
        uses: actions/download-artifact@v7
        with:
          name: critical-coverage-shard-1
          path: reports/critical-coverage-blobs
      - name: Download same-run shard 2 report
        uses: actions/download-artifact@v7
        with:
          name: critical-coverage-shard-2
          path: reports/critical-coverage-blobs
      - name: Download same-run shard 3 report
        uses: actions/download-artifact@v7
        with:
          name: critical-coverage-shard-3
          path: reports/critical-coverage-blobs
      - name: Download same-run shard 4 report
        uses: actions/download-artifact@v7
        with:
          name: critical-coverage-shard-4
          path: reports/critical-coverage-blobs

      - name: Merge coverage without rerunning tests
        run: node scripts/run-critical-coverage.mjs --merge-shards

      - name: Generate and enforce critical coverage artifact
        run: node scripts/report-critical-coverage.mjs && node scripts/check-critical-coverage.mjs

      - name: Upload critical coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: critical-coverage
          path: reports/critical-coverage.*
          retention-days: 30

  quality-static-base:
    name: quality-static-base (${{ matrix.check }})
    runs-on: ubuntu-latest
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies
        with:
          save-cache: ${{ matrix.check == 'lint' && 'true' || 'false' }}

      - name: Run release-blocking static check
        run: npm run ${{ matrix.check }} ${{ matrix.check == 'lint' && '-- --max-warnings 0 --concurrency 2' || '' }}

  quality-static-governance-snapshots:
    name: quality-static-governance-snapshots
    runs-on: ubuntu-latest
    needs: [quality-static-base, critical-coverage-report]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Download critical coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: critical-coverage
          path: reports

      - name: Generate governance and report snapshots
        run: npm run report:governance-snapshots

      - name: Enforce canonical reports are fresh after regeneration
        # If this fails after `report:governance-snapshots` succeeded, a
        # report generator silently dropped a snapshot or recorded a
        # stale gitSha. We want CI to surface that as a hard failure
        # rather than the local advisory in check:quality, so
        # `system-confidence` and friends only ever show "degraded" for
        # substantive reasons (real indicator failures), never because
        # the artifact itself was stale.
        run: npm run check:report-freshness:strict

      - name: Generate release evidence contract
        run: npm run report:release-evidence-contract

      - name: Enforce release evidence contract
        run: npm run check:release-evidence-contract:strict

      - name: Upload release evidence runtime contract
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence-runtime
          path: reports/release-evidence-runtime/
          retention-days: 30

      - name: Upload quality metrics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-metrics
          path: reports/quality-metrics.*
          retention-days: 30

      - name: Upload operational health artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operational-health
          path: reports/operational-health.*
          retention-days: 30

      - name: Upload runtime contracts artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-contracts
          path: reports/runtime-contracts.*
          retention-days: 30

      - name: Upload governance snapshot runtime profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: governance-snapshot-profile
          path: reports/ci-governance-snapshot-profile.*
          retention-days: 30

      - name: Upload governance snapshots for grouped static checks
        uses: actions/upload-artifact@v7
        with:
          name: quality-static-governance-snapshots
          path: reports/**
          retention-days: 7

  quality-static-groups:
    name: quality-static-${{ matrix.group }}
    runs-on: ubuntu-latest
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        group: [boundaries, security, size, tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Run quality static group
        run: npm run check:quality:group -- ${{ matrix.group }}

      - name: Upload quality static profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-static-profile-${{ matrix.group }}
          path: reports/ci-quality-static-profile-${{ matrix.group }}.*
          retention-days: 30

  quality-static-dependent-groups:
    name: quality-static-${{ matrix.group }}
    runs-on: ubuntu-latest
    needs: [quality-static-governance-snapshots]
    strategy:
      fail-fast: false
      matrix:
        group: [governance, reports]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Download governance snapshots
        if: matrix.group == 'governance'
        uses: actions/download-artifact@v7
        with:
          name: quality-static-governance-snapshots
          path: reports

      - name: Run quality static group
        run: npm run check:quality:group -- ${{ matrix.group }}

      - name: Upload quality static profile
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-static-profile-${{ matrix.group }}
          path: reports/ci-quality-static-profile-${{ matrix.group }}.*
          retention-days: 30

  quality-static:
    name: quality-static
    runs-on: ubuntu-latest
    needs:
      [quality-static-governance-snapshots, quality-static-groups, quality-static-dependent-groups]

    steps:
      - name: Quality static gates passed
        run: |
          echo "quality-static-governance-snapshots: passed"
          echo "quality-static groups: passed"

  clinical-sync-release-gate:
    name: clinical-sync-release-gate
    runs-on: ubuntu-latest
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Run clinical sync simulator
        run: npm run test:clinical-sync-simulator
        env:
          CI: true

      - name: Generate sync convergence evidence
        run: npm run report:sync-convergence

      - name: Validate sync convergence evidence contract
        run: npm run check:sync-convergence-evidence

      - name: Enforce sync convergence evidence freshness
        run: npm run check:sync-convergence-freshness:strict

      - name: Upload sync convergence evidence artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-convergence
          path: reports/sync-convergence.*
          retention-days: 30

  unit-risk-shards:
    name: unit-risk-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Run unit shard
        run: >-
          node scripts/report-test-execution-manifest.mjs
          --capture vitest --suite unit-${{ matrix.shard }}
          --report reports/execution/unit-${{ matrix.shard }}.raw.json
          --output reports/execution/unit-${{ matrix.shard }}.evidence.json
          -- npm run test:ci:unit:shard -- ${{ matrix.shard }}/4
          --reporter=default --reporter=json
          --outputFile=reports/execution/unit-${{ matrix.shard }}.raw.json
        env:
          CI: true

      - name: Upload unit 1 execution evidence
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: test-execution-evidence-unit-1
          path: reports/execution/unit-1.evidence.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload unit 2 execution evidence
        if: always() && matrix.shard == 2
        uses: actions/upload-artifact@v7
        with:
          name: test-execution-evidence-unit-2
          path: reports/execution/unit-2.evidence.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload unit 3 execution evidence
        if: always() && matrix.shard == 3
        uses: actions/upload-artifact@v7
        with:
          name: test-execution-evidence-unit-3
          path: reports/execution/unit-3.evidence.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30
      - name: Upload unit 4 execution evidence
        if: always() && matrix.shard == 4
        uses: actions/upload-artifact@v7
        with:
          name: test-execution-evidence-unit-4
          path: reports/execution/unit-4.evidence.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload test coverage shard artifact (optional)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-${{ matrix.shard }}
          path: coverage/
          retention-days: 7
        continue-on-error: true

  unit-risk:
    name: unit-risk
    runs-on: ubuntu-latest
    needs: [unit-risk-shards]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Prove critical risk packs are included in the unit suite
        run: npm run check:ci-risk-pack-membership

      - name: Enforce test runtime governance contract
        run: npm run check:test-runtime-governance

      - name: Generate test runtime governance evidence
        run: npm run report:test-runtime-governance

      - name: Enforce test run contract
        run: |
          echo "Unit/integration test suite completed through unit-risk-shards (without emulator-only suites)."
          echo "Critical risk packs remain covered by check:ci-risk-pack-membership."
          echo "Firestore rules + emulator sync/UI suites are enforced in dedicated firestore-rules job."

      - name: Upload test runtime governance artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-runtime-governance
          path: reports/test-runtime-governance.*
          retention-days: 30

  rules-emulator:
    name: rules-emulator
    runs-on: ubuntu-24.04
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare verified Firestore emulator artifact
        uses: ./.github/actions/setup-ci-firestore-emulator

      - name: Run Firestore rules tests with emulator
        run: npm run test:rules:ci
        env:
          CI: true
          RUN_FIRESTORE_RULES_TESTS: 1

      - name: Run clinical attachment Storage rules tests with emulators
        run: >-
          node scripts/report-test-execution-manifest.mjs
          --capture vitest --suite storage
          --report reports/execution/storage.raw.json
          --output reports/execution/storage.evidence.json
          -- npm run test:storage-rules:ci
        env:
          CI: true

      - name: Run Firestore emulator test suites (sync + UI)
        run: npm run test:emulator:sync:ci
        env:
          CI: true
          RUN_FIRESTORE_EMULATOR_TESTS: 1

      - name: Upload Storage execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-execution-evidence-storage
          path: reports/execution/storage.evidence.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Chromium for individual account browser flow
        uses: ./.github/actions/setup-ci-chromium

      - name: Validate individual accounts with Auth, Firestore and Storage emulators
        run: npm run test:accounts:emulator:ci

  e2e-critical-emulator:
    name: e2e-critical
    runs-on: ubuntu-24.04
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare verified Firestore emulator artifact
        uses: ./.github/actions/setup-ci-firestore-emulator

      - name: Install Playwright browser for critical E2E gate
        uses: ./.github/actions/setup-ci-chromium

      - name: Fetch pinned previous extension release
        run: git fetch --depth=1 origin eb77f41ae151251f7158fc28721cefe15145926c

      - name: Validate the packaged Rayen extension in Chromium
        run: npm run test:e2e:rayen-extension-runtime

      - name: Validate 0.48.33 to current extension upgrade with open tabs
        run: npm run test:e2e:rayen-extension-upgrade

      - name: Validate shared offscreen lifecycle in Chromium
        run: npm run test:e2e:shared-offscreen

      - name: Run critical E2E suite with Firestore emulator
        run: >-
          node scripts/report-test-execution-manifest.mjs
          --capture playwright --suite critical
          --report reports/e2e/critical-playwright-report.json
          --output reports/execution/critical.evidence.json
          -- npm run test:e2e:critical:ci
        env:
          CI: true
          E2E_CRITICAL_BROWSERS: chromium
          PLAYWRIGHT_JSON_OUTPUT: reports/e2e/critical-playwright-report.json
          E2E_FLOW_PLAYWRIGHT_JSON_OUTPUT: reports/e2e/flow-performance-playwright-report.json
          E2E_BUDGET_LOGIN_VISIBLE_MS: 4500
          E2E_BUDGET_AUTH_FEEDBACK_MS: 3000
          E2E_BUDGET_CENSO_VISIBLE_MS: 8000

      - name: Upload critical browser execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-execution-evidence-critical
          path: reports/execution/critical.evidence.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30

      - name: Upload flow browser execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-execution-evidence-flow
          path: reports/execution/flow.evidence.json
          overwrite: true
          if-no-files-found: error
          retention-days: 30

      - name: Verify authenticated census read against local emulators
        run: npm run test:e2e:census-remote-performance
        env:
          CI: true

      - name: Generate and enforce E2E operational metrics
        if: always()
        run: node scripts/report-e2e-operational-metrics.mjs reports/e2e/critical-playwright-report.json --enforce

      - name: Upload flow performance evidence
        uses: actions/upload-artifact@v7
        with:
          name: flow-performance-evidence
          path: |
            reports/e2e/flow-performance-budget.json
            reports/e2e/flow-performance-budget-summary.json
            reports/e2e/flow-performance-budget.md
            reports/e2e/flow-performance-playwright-report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Upload E2E critical artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-critical-emulator-artifacts
          path: |
            reports/e2e/**
            playwright-report/**
            test-results/**
          retention-days: 14

  test-execution-manifest:
    name: test-execution-manifest
    runs-on: ubuntu-latest
    needs: [ci-scope, unit-risk-shards, rules-emulator, e2e-critical-emulator]
    if: always() && needs.ci-scope.outputs.scope == 'full'
    steps:
      - name: Checkout tested merge tree
        uses: actions/checkout@v7
      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies
      - name: Download same-run unit-1 execution evidence
        uses: actions/download-artifact@v7
        with:
          name: test-execution-evidence-unit-1
          path: reports/execution
      - name: Download same-run unit-2 execution evidence
        uses: actions/download-artifact@v7
        with:
          name: test-execution-evidence-unit-2
          path: reports/execution
      - name: Download same-run unit-3 execution evidence
        uses: actions/download-artifact@v7
        with:
          name: test-execution-evidence-unit-3
          path: reports/execution
      - name: Download same-run unit-4 execution evidence
        uses: actions/download-artifact@v7
        with:
          name: test-execution-evidence-unit-4
          path: reports/execution
      - name: Download same-run storage execution evidence
        uses: actions/download-artifact@v7
        with:
          name: test-execution-evidence-storage
          path: reports/execution
      - name: Download same-run critical execution evidence
        uses: actions/download-artifact@v7
        with:
          name: test-execution-evidence-critical
          path: reports/execution
      - name: Download same-run flow execution evidence
        uses: actions/download-artifact@v7
        with:
          name: test-execution-evidence-flow
          path: reports/execution
      - name: Require all seven execution reports and validate provenance
        shell: bash
        run: |
          inputs=()
          for suite in unit-1 unit-2 unit-3 unit-4 storage critical flow; do
            evidence="reports/execution/$suite.evidence.json"
            test -f "$evidence" || { echo "::error::Missing $suite execution evidence"; exit 1; }
            inputs+=(--input "$evidence")
          done
          npm run report:test-execution-manifest -- "${inputs[@]}"
      - name: Upload execution manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-execution-manifest
          path: reports/test-execution-manifest.*
          overwrite: true
          if-no-files-found: error
          retention-days: 30

  build:
    name: build-budget
    runs-on: ubuntu-24.04
    # The build consumes the release-evidence runtime contract from this job.
    # Other release gates still block ci-summary, but can run alongside the build.
    # The preview smoke runs in preview-smoke-lanes so it no longer waits here.
    needs: [quality-static-governance-snapshots]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Download release evidence runtime contract
        uses: actions/download-artifact@v7
        with:
          name: release-evidence-runtime
          path: reports/release-evidence-runtime

      - name: Build production bundle
        run: npm run build
        env:
          CI: true

      - name: Validate Netlify mail budgets and runtime artifacts
        run: npm run check:netlify-functions-bundle

      - name: Upload Netlify mail runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: netlify-mail-runtime
          path: |
            reports/netlify-mail-runtime.json
            reports/netlify-mail-runtime.md
          retention-days: 14
          if-no-files-found: error
          overwrite: true

      - name: Enforce bundle budget
        run: npm run check:bundle-budget

      - name: Validate chunk import graph (no vendor↔feature cycles)
        run: npm run check:chunk-graph

      - name: Validate runtime asset margin
        run: npm run check:runtime-asset-margin

      - name: Upload production build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  preview-smoke-lanes:
    # The preview pack starts with the other gates instead of after build-budget.
    # Each lane serves its own bundle of the same commit: deployments rebuild on
    # Netlify, and the bundle differs from build-budget only in release-evidence.json.
    # Lanes are split by observed duration; see scripts/previewSmokeLaneSupport.mjs.
    name: preview-smoke-lane (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'
    strategy:
      fail-fast: false
      matrix:
        lane: [app, dicom-graphics-stress, dicom-1, dicom-2]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Build preview bundle
        run: npm run build
        env:
          CI: true

      - name: Install Playwright browsers for preview bootstrap smoke
        uses: ./.github/actions/setup-ci-chromium

      - name: Run preview smoke lane
        run: node scripts/run-preview-smoke-lane.mjs --lane=${{ matrix.lane }}
        env:
          CI: true

      - name: Upload app lane report
        if: always() && matrix.lane == 'app'
        uses: actions/upload-artifact@v7
        with:
          name: preview-smoke-blob-app
          path: reports/e2e/preview-blobs/app/app.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload dicom-graphics-stress lane report
        if: always() && matrix.lane == 'dicom-graphics-stress'
        uses: actions/upload-artifact@v7
        with:
          name: preview-smoke-blob-dicom-graphics-stress
          path: reports/e2e/preview-blobs/dicom-graphics-stress/dicom-graphics-stress.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload dicom-1 lane report
        if: always() && matrix.lane == 'dicom-1'
        uses: actions/upload-artifact@v7
        with:
          name: preview-smoke-blob-dicom-1
          path: reports/e2e/preview-blobs/dicom-1/dicom-1.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload dicom-2 lane report
        if: always() && matrix.lane == 'dicom-2'
        uses: actions/upload-artifact@v7
        with:
          name: preview-smoke-blob-dicom-2
          path: reports/e2e/preview-blobs/dicom-2/dicom-2.zip
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  preview-smoke:
    name: preview-smoke
    runs-on: ubuntu-latest
    needs: [ci-scope, preview-smoke-lanes]
    # Merge whatever the lanes reported so failures are still summarized.
    if: ${{ !cancelled() && needs.ci-scope.outputs.scope == 'full' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Download same-run app lane report
        uses: actions/download-artifact@v7
        with:
          name: preview-smoke-blob-app
          path: reports/e2e/preview-blobs
      - name: Download same-run dicom-graphics-stress lane report
        uses: actions/download-artifact@v7
        with:
          name: preview-smoke-blob-dicom-graphics-stress
          path: reports/e2e/preview-blobs
      - name: Download same-run dicom-1 lane report
        uses: actions/download-artifact@v7
        with:
          name: preview-smoke-blob-dicom-1
          path: reports/e2e/preview-blobs
      - name: Download same-run dicom-2 lane report
        uses: actions/download-artifact@v7
        with:
          name: preview-smoke-blob-dicom-2
          path: reports/e2e/preview-blobs

      - name: Merge census and clinical library preview lanes
        run: npx playwright merge-reports --config playwright.preview-merge.config.ts reports/e2e/preview-blobs
        env:
          PLAYWRIGHT_PREVIEW_ARTIFACTS_DIR: reports/e2e/preview-bootstrap

      - name: Summarize census and library results
        if: always()
        run: node scripts/report-preview-summary.mjs

      - name: Enforce every preview lane passed
        run: test "$PREVIEW_LANES_RESULT" = success
        env:
          PREVIEW_LANES_RESULT: ${{ needs['preview-smoke-lanes'].result }}

      - name: Prove every canonical preview test ran exactly once
        run: node scripts/check-preview-smoke-completeness.mjs

      - name: Enforce preview bootstrap report artifact
        run: test -f reports/e2e/preview-bootstrap/report.json

      - name: Record preview bootstrap artifact provenance
        run: npm run write:preview-bootstrap-provenance

      - name: Validate preview bootstrap artifact evidence
        run: npm run check:preview-bootstrap-evidence

      - name: Upload preview bootstrap artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: preview-bootstrap-artifacts
          path: reports/e2e/preview-bootstrap/
          retention-days: 14
          if-no-files-found: error
          overwrite: true

  final-confidence-and-readiness:
    name: final-confidence-and-readiness
    runs-on: ubuntu-latest
    needs: [quality-static-governance-snapshots, build, preview-smoke, e2e-critical-emulator]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Download governance snapshots
        uses: actions/download-artifact@v7
        with:
          name: quality-static-governance-snapshots
          path: reports

      - name: Download preview bootstrap artifacts
        uses: actions/download-artifact@v7
        with:
          name: preview-bootstrap-artifacts
          path: reports/e2e/preview-bootstrap

      - name: Download production build
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Validate downloaded preview bootstrap evidence
        run: npm run check:preview-bootstrap-evidence

      - name: Download same-run flow performance evidence
        uses: actions/download-artifact@v7
        with:
          name: flow-performance-evidence
          path: reports/e2e

      - name: Validate downloaded flow performance evidence
        run: |
          node scripts/check-playwright-report-clean.mjs reports/e2e/flow-performance-playwright-report.json --label flow-performance
          npm run check:flow-performance-budget

      - name: Regenerate confidence from final runtime evidence
        run: |
          npm run report:operational-health
          npm run report:system-confidence
          npm run report:release-readiness-scorecard:from-current-inputs

      - name: Enforce final confidence evidence freshness
        run: npm run check:report-freshness:strict -- --only operational-health,system-confidence,release-readiness-scorecard

      - name: Upload final system confidence + release readiness artifacts
        uses: actions/upload-artifact@v7
        with:
          name: confidence-and-readiness
          path: |
            reports/system-confidence.*
            reports/clinical-release-signoff.*
            reports/release-readiness-scorecard.*
            reports/release-confidence-matrix.*
            reports/maintenance-debt-scorecard.*
            reports/operational-health.*
            reports/e2e/preview-bootstrap/ci-provenance.json
            reports/e2e/flow-performance-budget.json
            reports/e2e/flow-performance-budget-summary.json
            reports/e2e/flow-performance-playwright-report.json
          retention-days: 30

  census-startup-performance:
    name: census-startup-performance (${{ matrix.environment }})
    runs-on: ubuntu-24.04
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'
    # Ceiling for a pathologically slow startup, not an expectation.
    # Observed: production ~4 min, development ~13 min.
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        environment: [development, production]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies
      - name: Install Chromium
        uses: ./.github/actions/setup-ci-chromium
      - name: Validate measurement report contracts
        run: npm run test:census-performance-report
      - name: Measure populated census navigations per scenario
        run: npm run test:e2e:census-performance
        env:
          CENSUS_PERF_ENV: ${{ matrix.environment }}
          CENSUS_PERF_INCLUDE_INTERACTIONS: ${{ matrix.environment == 'production' && '1' || '0' }}
          # Pull requests run a small screening sample for fast feedback. Pushes keep
          # the release-quality 30-sample measurement used as a valid baseline.
          CENSUS_PERF_SAMPLES: ${{ github.event_name == 'pull_request' && '5' || '30' }}
          CENSUS_PERF_SMOKE: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          CENSUS_PERF_RUNNER: github-ubuntu-latest
      - name: Upload privacy-safe timing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: census-startup-performance-${{ matrix.environment }}
          path: |
            reports/e2e/census-performance-*.json
            test-results/census-performance/**
            test-results/census-interactions/**
          retention-days: 30
          if-no-files-found: warn

  lighthouse-ci:
    # Performance instrumentation. Warn-only — assertions in lighthouserc.json
    # use "warn" severity so this job surfaces trends in the PR/run summary
    # without blocking releases. Promote individual assertions to "error"
    # only once the team has agreed on a budget that the current bundle
    # actually meets.
    name: lighthouse-ci
    runs-on: ubuntu-latest
    needs: [build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      # Measure the exact bundle already validated by build-budget in this run.
      - name: Download validated production build
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  ci-runtime-telemetry:
    name: ci-runtime-telemetry
    runs-on: ubuntu-latest
    needs:
      [
        quality-static,
        unit-risk,
        clinical-sync-release-gate,
        rules-emulator,
        e2e-critical-emulator,
        build,
      ]
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # These telemetry scripts use only Node.js built-ins and the GitHub API.
      - name: Collect GitHub Actions runtime data
        run: npm run collect:ci-runtime-observed-input
        env:
          CI_RUNTIME_COLLECTION_REQUIRED: '1'
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate observed CI runtime telemetry evidence
        run: npm run report:ci-runtime-observed-profile

      - name: Enforce observed CI runtime telemetry contract
        run: npm run check:ci-runtime-telemetry

      - name: Upload observed CI runtime telemetry artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-runtime-observed-profile
          path: reports/ci-runtime-observed-*
          retention-days: 30

  ci-strict-summary:
    name: ci-summary
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions: {}
    needs:
      [
        ci-scope,
        docs-scope-gate,
        functions-scope-gate,
        quality-static,
        unit-risk,
        test-execution-manifest,
        clinical-sync-release-gate,
        rules-emulator,
        e2e-critical-emulator,
        build,
        preview-smoke,
        final-confidence-and-readiness,
        ci-runtime-telemetry,
        census-startup-performance,
      ]
    env:
      CI_SCOPE_RESULT: ${{ needs['ci-scope'].result }}
      CI_SCOPE: ${{ needs['ci-scope'].outputs.scope }}
      DOCS_SCOPE_GATE_RESULT: ${{ needs['docs-scope-gate'].result }}
      FUNCTIONS_SCOPE_GATE_RESULT: ${{ needs['functions-scope-gate'].result }}
      QUALITY_STATIC_RESULT: ${{ needs['quality-static'].result }}
      TEST_EXECUTION_RESULT: ${{ needs['test-execution-manifest'].result }}
      UNIT_RISK_RESULT: ${{ needs['unit-risk'].result }}
      CLINICAL_SYNC_RESULT: ${{ needs['clinical-sync-release-gate'].result }}
      RULES_EMULATOR_RESULT: ${{ needs['rules-emulator'].result }}
      E2E_CRITICAL_RESULT: ${{ needs['e2e-critical-emulator'].result }}
      BUILD_RESULT: ${{ needs.build.result }}
      PREVIEW_SMOKE_RESULT: ${{ needs['preview-smoke'].result }}
      FINAL_CONFIDENCE_RESULT: ${{ needs['final-confidence-and-readiness'].result }}
      CI_RUNTIME_TELEMETRY_RESULT: ${{ needs['ci-runtime-telemetry'].result }}
      CENSUS_PERFORMANCE_RESULT: ${{ needs['census-startup-performance'].result }}
    steps:
      - name: Enforce strict gate outcomes
        shell: bash
        run: |
          failures=0

          if [[ "$CI_SCOPE_RESULT" != "success" || "$DOCS_SCOPE_GATE_RESULT" != "success" || "$FUNCTIONS_SCOPE_GATE_RESULT" != "success" ]]; then
            echo "::error::CI scope classification or focused validation did not pass."
            exit 1
          fi

          expected_result="success"
          if [[ "$CI_SCOPE" == "docs-only" || "$CI_SCOPE" == "functions-only" ]]; then
            expected_result="skipped"
          fi

          for gate in \
            "quality-static:$QUALITY_STATIC_RESULT" \
            "unit-risk:$UNIT_RISK_RESULT" \
            "test-execution-manifest:$TEST_EXECUTION_RESULT" \
            "clinical-sync-release-gate:$CLINICAL_SYNC_RESULT" \
            "rules-emulator:$RULES_EMULATOR_RESULT" \
            "e2e-critical-emulator:$E2E_CRITICAL_RESULT" \
            "build:$BUILD_RESULT" \
            "preview-smoke:$PREVIEW_SMOKE_RESULT" \
            "final-confidence-and-readiness:$FINAL_CONFIDENCE_RESULT" \
            "ci-runtime-telemetry:$CI_RUNTIME_TELEMETRY_RESULT" \
            "census-startup-performance:$CENSUS_PERFORMANCE_RESULT"
          do
            name="${gate%%:*}"
            result="${gate#*:}"
            echo "$name: $result"

            if [[ "$result" != "$expected_result" ]]; then
              failures=$((failures + 1))
            fi
          done

          if (( failures > 0 )); then
            echo "::error::$failures CI gate(s) did not match the required $CI_SCOPE scope outcome."
            exit 1
          fi

  postmerge-evidence:
    name: postmerge-evidence
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, preview-smoke, ci-strict-summary, e2e-critical-emulator]
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Validate CI artifact contract
        run: npm run check:ci-artifact-contracts

      - name: Verify build artifact availability
        run: node scripts/verify-github-run-artifact.mjs --artifact dist --producer build-budget
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify preview bootstrap artifact availability
        run: node scripts/verify-github-run-artifact.mjs --artifact preview-bootstrap-artifacts --producer preview-smoke
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify critical coverage artifact availability
        run: node scripts/verify-github-run-artifact.mjs --artifact critical-coverage --producer critical-coverage-report
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Verify release evidence runtime artifact availability
        run: node scripts/verify-github-run-artifact.mjs --artifact release-evidence-runtime --producer quality-static-governance-snapshots
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Download preview bootstrap artifacts
        uses: actions/download-artifact@v7
        with:
          name: preview-bootstrap-artifacts
          path: reports/e2e/preview-bootstrap

      - name: Download critical coverage artifact
        uses: actions/download-artifact@v7
        with:
          name: critical-coverage
          path: reports

      - name: Download release evidence runtime contract
        uses: actions/download-artifact@v7
        with:
          name: release-evidence-runtime
          path: reports/release-evidence-runtime

      - name: Validate downloaded preview bootstrap evidence
        run: npm run check:preview-bootstrap-evidence

      - name: Verify built release evidence contract
        run: npm run check:release-evidence-contract:built

      - name: Download same-run flow performance evidence
        uses: actions/download-artifact@v7
        with:
          name: flow-performance-evidence
          path: reports/e2e

      - name: Validate downloaded flow performance evidence
        run: |
          node scripts/check-playwright-report-clean.mjs reports/e2e/flow-performance-playwright-report.json --label flow-performance
          npm run check:flow-performance-budget

      - name: Generate post-merge release evidence
        run: npm run postmerge:evidence

      - name: Verify post-merge release evidence
        run: npm run check:postmerge-evidence:strict

      - name: Upload post-merge release evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: postmerge-release-evidence
          path: |
            reports/postmerge-evidence.*
            reports/release-evidence-contract.*
          retention-days: 30

  # ============================================
  # JOB 6: DOCUMENTATION
  # ============================================
  docs:
    name: API Documentation
    runs-on: ubuntu-latest
    needs: [ci-scope]
    if: needs.ci-scope.outputs.scope == 'full'

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Generate API Documentation
        run: npm run docs:generate

      - name: Upload documentation artifact
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v7
        with:
          name: api-documentation
          path: './docs/api'
          retention-days: 7

  function-deploy-scope:
    name: function-deploy-scope
    needs: [ci-strict-summary]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.scope.outputs.changed }}
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Detect Functions-related changes
        id: scope
        run: node scripts/check-function-deployment-ci.mjs --scope

  deploy-functions:
    name: validated-functions-deployment
    needs: [ci-strict-summary, function-deploy-scope]
    if: needs.function-deploy-scope.outputs.changed == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-functions.yml
    secrets:
      FIREBASE_SERVICE_ACCOUNT_HHR: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HHR }}
