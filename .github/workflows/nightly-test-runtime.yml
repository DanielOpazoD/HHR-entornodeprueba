name: Nightly Test Runtime Governance

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_dispatch:
  schedule:
    - cron: '30 8 * * *'

jobs:
  nightly-runtime-governance:
    name: nightly-runtime-governance
    # Match the supported browser host used by the PR clinical E2E lane.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser for nightly clinical flows
        uses: ./.github/actions/setup-ci-chromium
        timeout-minutes: 15

      - name: Validate runtime governance contract
        run: npm run check:test-runtime-governance

      - name: Run sync load budget
        run: npm run test:sync-load
        env:
          CI: true

      - name: Run full release confidence pack
        run: npm run test:release-confidence:full
        env:
          CI: true

      - name: Run clinical stability E2E suite
        run: npm run test:e2e:clinical-stability:ci
        env:
          CI: true
          E2E_CRITICAL_BROWSERS: chromium

      - name: Generate test runtime governance report
        if: always()
        run: npm run report:test-runtime-governance

      - name: Upload test runtime governance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-runtime-governance
          path: |
            reports/test-runtime-governance.*
            reports/e2e/**
            test-results/**
            playwright-report/**
          retention-days: 30

  # The required rules-emulator check runs the save-queue model with its fixed seed (20261115),
  # so a pull request or main fails only for its own change. New sequences are drawn here; a
  # counterexample is reported with its seed, path and replay and blocks no deploy.
  nightly-sync-model:
    name: nightly-sync-model
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup CI dependencies
        uses: ./.github/actions/setup-ci-dependencies

      - name: Setup Java (Firestore emulator)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare verified Firestore emulator artifact
        uses: ./.github/actions/setup-ci-firestore-emulator

      - name: Explore the save-queue model with a new seed
        run: |
          set -o pipefail
          seed="$(node -e 'console.log(require("node:crypto").randomInt(-(2 ** 31), 2 ** 31))')"
          status=0
          FC_SEED="$seed" FC_NUM_RUNS=300 npm run test:emulator:file -- \
            src/tests/emulator-ui/syncQueueModel.emulator-ui.test.ts -- -t 'random sequences' \
            2>&1 | tee model.log || status=$?
          {
            echo "### Modelo de la cola: semilla $seed, 300 secuencias"
            if [ "$status" -eq 0 ]; then
              echo 'Sin contraejemplos.'
            else
              echo 'Contraejemplo. Repetirlo en local con FC_SEED, FC_PATH y FC_REPLAY:'
              echo '```'
              sed 's/\x1b\[[0-9;]*m//g' model.log | grep -E 'Property failed|seed:|^Counterexample:' || echo 'Sin contraejemplo en el log: revisar el paso.'
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
        env:
          CI: true
