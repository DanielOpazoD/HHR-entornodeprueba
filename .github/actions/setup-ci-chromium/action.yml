name: Setup CI Chromium
description: Reuse the exact Playwright browser while always preparing its system dependencies.
runs:
  using: composite
  steps:
    - name: Identify Chromium cache
      id: browser
      shell: bash
      run: |
        version=$(node -p "require('playwright-core/package.json').version")
        printf 'key=chromium-v2-%s-%s-%s-%s-%s-%s\n' "${ImageOS:?}" "${ImageVersion:?}" "${RUNNER_OS:?}" \
          "${RUNNER_ARCH:?}" "$version" '${{ hashFiles('.github/actions/setup-ci-chromium/action.yml') }}' >> "$GITHUB_OUTPUT"
    - name: Restore exact Chromium installation
      id: chromium
      uses: actions/cache/restore@v6.1.0
      continue-on-error: true
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/hhr-chromium-debs
        # Saved entries end in the fingerprint of the .deb files apt installed. When Ubuntu
        # publishes newer packages for the same image, the first job downloads them once and
        # saves a new entry; the newest entry for this image and Playwright wins.
        key: ${{ steps.browser.outputs.key }}
        restore-keys: ${{ steps.browser.outputs.key }}-
    # Mandatory on hits, misses and cache outages. The cache may hold the downloaded .deb files,
    # but apt-get installs the system libraries on every run.
    - name: Prepare Playwright Chromium and system dependencies
      id: install
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/install-chromium.sh"
    - name: Verify Chromium can launch
      shell: bash
      run: |
        node --input-type=module - <<'JS'
        import { chromium } from 'playwright';
        import { execFileSync } from 'node:child_process';
        const verify = async () => {
          const browser = await chromium.launch();
          await browser.close();
        };
        try {
          await verify();
        } catch {
          // A damaged cache must be repaired through the same pinned Playwright CLI.
          execFileSync(process.execPath, ['node_modules/playwright/cli.js', 'install', '--force', 'chromium'], { stdio: 'inherit' });
          await verify();
        }
        JS
    # Publish before any caller executes browser tests, which may mutate profiles or artifacts.
    - name: Save prepared Chromium installation
      if: steps.chromium.outputs.cache-matched-key != format('{0}-{1}', steps.browser.outputs.key, steps.install.outputs.debs)
      uses: actions/cache/save@v6.1.0
      continue-on-error: true
      with:
        path: |
          ~/.cache/ms-playwright
          ~/.cache/hhr-chromium-debs
        key: ${{ steps.browser.outputs.key }}-${{ steps.install.outputs.debs }}
