[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["xlsx-populate", "exceljs", "sharp"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # CSP: 'unsafe-inline' removed from script-src (2026-04-09).
    # Vite emits only <script type="module" src="..."> tags and VitePWA
    # externalises SW registration to /registerSW.js — no inline scripts
    # exist in the built HTML, so 'unsafe-inline' is unnecessary.
    # style-src keeps 'unsafe-inline' because Vite and UI libs inject inline styles.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' https://apis.google.com https://www.gstatic.com https://accounts.google.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://apis.google.com https://accounts.google.com https://*.googleapis.com https://www.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firebasestorage.googleapis.com https://*.firebasestorage.app https://*.firebaseio.com wss://*.firebaseio.com https://*.cloudfunctions.net https://generativelanguage.googleapis.com https://api.ipify.org; frame-src 'self' blob: https://accounts.google.com https://*.firebaseapp.com https://*.google.com;"
    Cross-Origin-Opener-Policy = "unsafe-none"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# The offline fallback is a legacy static page with inline script.
# Keep the SPA shell strict, but relax CSP only for this isolated asset.
[[headers]]
  for = "/offline.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self' https: data: blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https:; frame-src 'self' https: blob:;"

# Cache-Control: HTML and dynamic files must never be cached
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache-Control: Vite hashed assets are immutable and safe to cache forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache-Control: Service workers and the registration script must never be cached.
# Older deployments used /sw.js, while the current VitePWA build registers
# /service-worker.js via /registerSW.js. All three must stay revalidated to
# avoid mixed-version chunk graphs after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache-Control: PWA manifest should be revalidated
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
