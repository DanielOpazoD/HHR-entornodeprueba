<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="Content-Security-Policy" content="form-action 'none'; base-uri 'none'">
    <title>Acceso a Rayen Urgencias</title>
    <link rel="stylesheet" href="urgency-login.css">
  </head>
  <body>
    <h1>Acceso a Rayen Urgencias</h1>
    <p class="hint">Inicia sesión para descargar el DAU seleccionado.</p>
    <form id="login-form" method="post" autocomplete="off">
      <label>Usuario<input name="username" autocomplete="username" maxlength="128" required></label>
      <label>Contraseña<input name="password" type="password" autocomplete="off" maxlength="1024" required></label>
      <label>Dominio<input name="domain" value="hangaroa" autocomplete="off" maxlength="80" required></label>
      <button type="submit">Iniciar sesión</button>
    </form>
    <form id="otp-form" method="post" hidden autocomplete="off">
      <p>Ingresa el código de tu aplicación de verificación.</p>
      <label>Código de verificación<input name="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
      <button type="submit">Verificar código</button>
    </form>
    <form id="profile-form" method="post" hidden>
      <label>Establecimiento y perfil<select name="choiceId" required></select></label>
      <button type="submit">Continuar</button>
    </form>
    <output id="status" role="status" aria-live="polite">Comprobando el acceso…</output>
    <button id="cancel" type="button" class="cancel">Cancelar</button>
    <p class="hint privacy">La contraseña se envía a Rayen y no se guarda.</p>
    <script src="message-contract.js"></script>
    <script src="urgency-login.js"></script>
  </body>
</html>
