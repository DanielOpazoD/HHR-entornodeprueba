<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puente Eloísa → HHR</title>
  <link rel="stylesheet" href="extension-status.css">
</head>
<body>
  <main>
    <header class="brand">
      <img src="icons/hanga-roa-48.png" width="32" height="32" alt="">
      <h1>Eloísa <span>→</span> HHR</h1>
      <details class="version">
        <summary title="Detalles del paquete"><span id="extension-version">…</span></summary>
        <small id="extension-build"></small>
      </details>
    </header>
    <section class="release" aria-label="Actualización">
      <p id="release-status" role="status" aria-live="polite">Comprobando versión…</p>
      <a id="update-download" data-download class="action" hidden>Descargar</a>
      <button id="retry-release" class="action" type="button" hidden>Reintentar</button>
    </section>
    <nav aria-label="Opciones">
      <a class="row" href="installation.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-3-2-6-2-9-1v14c3-1 6-1 9 1 3-2 6-2 9-1V5c-3-1-6-1-9 1Zm0 0v14"/></svg>
        Guía de instalación <span class="arrow" aria-hidden="true">›</span>
      </a>
      <button class="row" type="button" id="manage-extension">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8M7 6a8 8 0 1 0 10 0"/></svg>
        Deshabilitar en Chrome <span class="arrow" aria-hidden="true">↗</span>
      </button>
    </nav>
    <p id="download-feedback" role="status" hidden></p>
    <p id="manage-error" role="status" hidden></p>
    <p id="worker-status" role="status"></p>
  </main>
  <script src="extension-download.js"></script>
  <script src="build-identity.js"></script>
  <script src="extension-status.js"></script>
  <script src="extension-release-status.js"></script>
  <script src="extension-worker-status.js"></script>
</body>
</html>
