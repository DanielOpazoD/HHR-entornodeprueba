<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Versión del puente Eloísa → HHR</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1e293b;
        background: #f8fafc;
      }

      body {
        width: 300px;
        margin: 0;
      }

      main {
        padding: 18px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      header img {
        width: 34px;
        height: 34px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 14px;
        line-height: 1.25;
      }

      .subtitle {
        margin-top: 2px;
        color: #64748b;
        font-size: 11px;
      }

      .version {
        margin-top: 16px;
        padding: 14px 15px;
        border-left: 4px solid #0f766e;
        background: #ecfdf5;
      }

      .version-label {
        color: #475569;
        font-size: 11px;
      }

      #extension-version {
        display: block;
        margin-top: 2px;
        color: #115e59;
        font-size: 28px;
        font-weight: 750;
        letter-spacing: -0.03em;
      }

      .capability {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 14px;
        font-size: 12px;
      }

      .capability::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #0f766e;
        content: "";
      }

      footer {
        margin-top: 14px;
        border-top: 1px solid #e2e8f0;
        padding-top: 11px;
        color: #64748b;
        font-size: 10px;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="hhr-logo.svg" alt="" />
        <div>
          <h1>Puente Eloísa → HHR</h1>
          <p class="subtitle">Extensión clínica local</p>
        </div>
      </header>

      <section class="version" aria-labelledby="version-label">
        <p id="version-label" class="version-label">Versión que Chrome está usando</p>
        <strong id="extension-version" aria-live="polite">Cargando…</strong>
      </section>

      <p class="capability">Gestor documental incluido</p>

      <footer>
        Pulsa este icono cuando necesites confirmar rápidamente la versión cargada.
      </footer>
    </main>
    <script src="extension-status.js"></script>
  </body>
</html>
